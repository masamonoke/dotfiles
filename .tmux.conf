set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on
set -g allow-passthrough on
set -g mouse on
set -ga terminal-overrides ",xterm-256color:Tc"

set-window-option -g mode-keys vi
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind-key o last-window

set -g @copy_mode_yank 'on'

set -g @tmux-gruvbox 'dark256'
run-shell ~/dev/open-source/tmux-gruvbox/gruvbox-tpm.tmux

set -g status-right '#{battery_color_bg} Batt: #{battery_icon} #{battery_percentage} #{battery_remain} #[default]| %a %h-%d %H:%M '
run ~/dev/open-source/tmux-battery/battery.tmux
